<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>うぱ狩り</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
:root{--sky1:#e8e1fb;--sky2:#dceafb;--sky3:#cff2ed;--ink:#4a4066;--lav:#b79be8;--aqua:#6fc3d6;--gold:#c6820a;--red:#e0567a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(180deg,#f1ecff,#dceafb 55%,#cff2ed);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;color:var(--ink)}
#stage{position:relative;width:min(480px,96vw);height:min(760px,92vh);border-radius:32px;overflow:hidden;box-shadow:0 24px 60px rgba(120,100,180,.28);background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));touch-action:none;user-select:none}
#basin{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(180deg,rgba(207,242,237,0),rgba(180,225,220,.55));z-index:5;pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding:16px 18px 10px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}.pill{background:rgba(255,255,255,.86);border-radius:20px;padding:8px 16px;box-shadow:0 4px 12px rgba(120,100,180,.18);display:flex;flex-direction:column;line-height:1.15}.label{font-size:11px;font-weight:700;letter-spacing:1px;color:#9c8fc4}.value{font-size:24px;font-weight:900}.warn .value{color:var(--red)}
#basket{position:absolute;bottom:26px;width:118px;height:82px;z-index:15;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(120,100,180,.35))}.drop{position:absolute;width:64px;height:64px;z-index:10;pointer-events:none}.drop img{width:100%;height:100%;display:block}.drop.gold:before,.drop.red:before{content:"";position:absolute;inset:-10px;border-radius:50%;z-index:-1}.drop.gold:before{background:radial-gradient(circle,rgba(240,180,41,.55),rgba(240,180,41,0) 70%)}.drop.red:before{background:radial-gradient(circle,rgba(242,139,164,.55),rgba(242,139,164,0) 70%)}
.badge{position:absolute;top:-6px;right:-6px;font-size:13px;font-weight:900;border-radius:999px;padding:1px 6px;box-shadow:0 2px 6px rgba(0,0,0,.2);color:white}.goldBadge{background:var(--gold)}.redBadge{background:var(--red)}
.float{position:absolute;font-weight:900;font-size:20px;z-index:25;pointer-events:none;animation:up .9s ease-out forwards}@keyframes up{to{opacity:0;transform:translateY(-46px) scale(1.15)}}
.overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:linear-gradient(180deg,rgba(232,225,251,.92),rgba(207,242,237,.94));gap:16px}.hidden{display:none}.overlay h1{margin:0;font-size:30px;letter-spacing:1px}.hero{width:120px;height:120px;filter:drop-shadow(0 10px 16px rgba(120,100,180,.3))}.overlay p{margin:0;font-size:14px;line-height:1.7;color:#6c5f91;max-width:300px}.rule{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.sw{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:white;font-weight:900;box-shadow:0 3px 6px rgba(0,0,0,.15)}.normal{background:var(--lav)}.gold{background:var(--gold)}.red{background:var(--red)}button{margin-top:6px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--lav),var(--aqua));color:white;font:900 17px inherit;padding:14px 40px;border-radius:999px;box-shadow:0 10px 20px rgba(120,100,180,.4)}button:active{transform:scale(.96)}.final{font-size:56px;font-weight:900;line-height:1}.final small{font-size:20px;margin-left:4px;color:#8e7cc3}
</style>
</head>
<body>
<div id="stage">
<div id="basin"></div>
<div id="hud"><div class="pill"><span class="label">SCORE</span><span class="value" id="score">0</span></div><div class="pill" id="timer"><span class="label">TIME</span><span class="value" id="time">30</span></div></div>
<svg id="basket" viewBox="0 0 118 82" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9aeef"/><stop offset="1" stop-color="#8fd3e6"/></linearGradient></defs><path d="M8 26 L110 26 L96 74 Q59 84 22 74 Z" fill="url(#bg)" stroke="#6b5b95" stroke-width="4" stroke-linejoin="round"/><path d="M8 26 Q59 42 110 26" fill="none" stroke="#6b5b95" stroke-width="4" stroke-linecap="round"/><path d="M18 34 Q59 48 100 34" fill="none" stroke="#efe6ff" stroke-width="3" opacity=".7"/><path d="M24 46 Q59 58 94 46" fill="none" stroke="#efe6ff" stroke-width="3" opacity=".5"/></svg>
<div id="play" style="position:absolute;inset:0;overflow:hidden"></div>
<div class="overlay" id="start"><img class="hero" src="upa.svg" alt="うぱ"><h1>うぱ狩り</h1><p>落ちてくる「うぱ」をかごでキャッチ！<br>マウス操作（スマホはドラッグ）でかごを動かそう。<br>制限時間は30秒。</p><div class="rule"><span class="sw normal">1</span>ふつうのうぱ = 1ポイント</div><div class="rule"><span class="sw gold">3</span>金のうぱ = 3ポイント</div><div class="rule"><span class="sw red">+3</span>赤のうぱ = 時間+3秒</div><button id="startBtn">スタート</button></div>
<div class="overlay hidden" id="end"><h1>タイムアップ！</h1><div class="final"><span id="final">0</span><small>うぱ</small></div><button id="retry">もう一回</button></div>
</div>
<script>
(()=>{const UPA='upa.svg',stage=document.getElementById('stage'),play=document.getElementById('play'),basket=document.getElementById('basket'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),timer=document.getElementById('timer'),start=document.getElementById('start'),end=document.getElementById('end'),finalEl=document.getElementById('final');let W=0,H=0,bx=0,score=0,time=30,running=false,drops=[],spawn=0,last=0,interval=null,raf=null;const BW=118,BH=82;
function size(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;if(!bx)bx=W/2;pos()}function pos(){bx=Math.max(BW/2,Math.min(W-BW/2,bx));basket.style.left=bx+'px'}function move(x){bx=x-stage.getBoundingClientRect().left;pos()}addEventListener('resize',size);stage.addEventListener('mousemove',e=>{if(running)move(e.clientX)});stage.addEventListener('touchmove',e=>{if(running&&e.touches[0]){move(e.touches[0].clientX);e.preventDefault()}},{passive:false});stage.addEventListener('touchstart',e=>{if(running&&e.touches[0])move(e.touches[0].clientX)});
function type(){const r=Math.random();return r<.12?'gold':r<.27?'red':'normal'}function addDrop(){const t=type(),el=document.createElement('div'),s=64,x=20+Math.random()*(W-40-s);el.className='drop '+t;el.style.left=x+'px';el.style.top='-70px';const img=document.createElement('img');img.src=UPA;if(t==='gold')img.style.filter='sepia(1) saturate(6) hue-rotate(-18deg) brightness(1.05)';if(t==='red')img.style.filter='sepia(.35) saturate(5.5) hue-rotate(-35deg) brightness(1.03)';el.appendChild(img);if(t!=='normal'){const b=document.createElement('div');b.className='badge '+(t==='gold'?'goldBadge':'redBadge');b.textContent=t==='gold'?'×3':'+3s';el.appendChild(b)}play.appendChild(el);drops.push({el,x,y:-70,s,speed:(1.6+Math.random()*1.3)*(1+Math.floor(score/20)*.18),t})}
function float(txt,x,y,c){const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';f.style.color=c;play.appendChild(f);setTimeout(()=>f.remove(),900)}function hud(){scoreEl.textContent=score;timeEl.textContent=Math.max(0,Math.ceil(time));timer.classList.toggle('warn',time<=10)}
function loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(40,ts-last);last=ts;spawn+=dt;const every=Math.max(420,900-score*4);if(spawn>every){spawn=0;addDrop()}const top=H-26-BH*.55,left=bx-BW/2+10,right=bx+BW/2-10;for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.y+=d.speed*(dt/16.7);d.el.style.top=d.y+'px';const cx=d.x+d.s/2,bottom=d.y+d.s*.85;if(bottom>=top&&d.y<H-20&&cx>left&&cx<right){let pts=1,txt='+1',c='#8e7cc3';if(d.t==='gold'){pts=3;txt='+3';c='#c6820a'}if(d.t==='red'){pts=0;time+=3;txt='+3s';c='#e0567a'}score+=pts;float(txt,d.x,d.y-10,c);d.el.remove();drops.splice(i,1);hud();continue}if(d.y>H+20){d.el.remove();drops.splice(i,1)}}raf=requestAnimationFrame(loop)}
function stop(){running=false;clearInterval(interval);cancelAnimationFrame(raf);drops.forEach(d=>d.el.remove());drops=[];finalEl.textContent=score;end.classList.remove('hidden')}function go(){score=0;time=30;drops.forEach(d=>d.el.remove());drops=[];spawn=0;last=0;hud();start.classList.add('hidden');end.classList.add('hidden');running=true;interval=setInterval(()=>{time--;hud();if(time<=0)stop()},1000);raf=requestAnimationFrame(loop)}document.getElementById('startBtn').onclick=()=>{size();go()};document.getElementById('retry').onclick=go;size();hud()})();
</script>
</body>
</html>
